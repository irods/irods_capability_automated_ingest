services:
  redis:
    image: redis

  irods-catalog:
    build:
      context: irods_catalog
    environment:
      - POSTGRES_PASSWORD=testpassword

  irods-catalog-provider:
    build:
      context: irods_catalog_provider
    hostname: irods-catalog-provider
    volumes:
      - shared_volume:/data/ufs
    depends_on:
      - irods-catalog

  ingest-test:
    build:
      context: test
    environment:
      - "PIP_PACKAGE"
      - "TEST_CASE"
      - "IRODS_PORT"
      - "IRODS_HOST"
      - "IRODS_USER_NAME"
      - "IRODS_ZONE_NAME"
      - "IRODS_ENVIRONMENT_FILE"
      - "IRODS_PASSWORD"
    volumes:
      - shared_volume:/data/ufs
      - ../..:/ingest-repo
    depends_on:
      - redis
      - irods-catalog-provider
      - rustfs

  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - "19000:19000" # This is the port to use for issuing S3 requests.
      - "19001:19001" # Change this port, if needed, to access the RustFS console webpage.
    environment:
      RUSTFS_ROOT_USER: irods
      RUSTFS_ROOT_PASSWORD: irodsadmin
      RUSTFS_ADDRESS: ":19000"
      RUSTFS_CONSOLE_ADDRESS: ":19001"

volumes:
    shared_volume:
